name: Install AIFT Marketplace Review Routing

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-aift-review-routing.yml"
      - "scripts/install-aift-review-routing.js"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install review routing
        run: node scripts/install-aift-review-routing.js
      - name: Validate backend JavaScript
        run: |
          node --check routes/reviewCases.js
          node --check services/aiftReviewWorkflow.js
          node --check routes/ventures.js
          node --check routes/scholarshipApplications.js
          node --check routes/internshipApplications.js
          node --check routes/schoolCompanyPartnerships.js
      - name: Commit routed marketplace actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ventures.js routes/scholarshipApplications.js routes/internshipApplications.js routes/schoolCompanyPartnerships.js
          if git diff --cached --quiet; then
            echo "No route changes required"
          else
            git commit -m "Route AIFT marketplace actions through Review Center [skip ci]"
            git push
          fi
