name: Fix Investor workspace compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-investor-family-workspace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch investor access to use Family capability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('routes/ventures.js')
          s=p.read_text(encoding='utf-8')
          old='''function hasInvestorAccess(\n  user\n){\n\n  if(!user){\n\n    return false;\n\n  }\n\n\n  if(\n    isAdmin(\n      user\n    )\n  ){\n\n    return true;\n\n  }\n\n\n  return (\n    normalizeRole(\n      user\n    ) ===\n      "family" &&\n    user\n      .familyProfile\n      ?.investorEnabled ===\n      true\n  );\n\n}\n'''
          new='''function hasInvestorAccess(\n  user\n){\n\n  if(!user){\n    return false;\n  }\n\n  if(isAdmin(user)){\n    return true;\n  }\n\n  // Investor Mode belongs to the authenticated account's Family workspace.\n  // The account keeps its primary AIFT role (school, employer, student, etc.).\n  return user.familyProfile?.investorEnabled === true;\n\n}\n'''
          if old not in s:
              raise SystemExit('hasInvestorAccess block not found')
          s=s.replace(old,new,1)

          start=s.index('      const investorAllowed =', s.index('"/investor/discover"'))
          end=s.index('\n\n\n      if(!investorAllowed)', start)
          s=s[:start]+'      const investorAllowed =\n        hasInvestorAccess(\n          investor\n        );'+s[end:]

          # Any remaining role-specific Investor Mode guard in this route file should
          # treat familyProfile.investorEnabled as the capability, not role==family.
          old_expr='''        normalizeRole(\n          req.user\n        ) ===\n          "family" &&\n        req.user\n          .familyProfile\n          ?.investorEnabled ===\n          true'''
          s=s.replace(old_expr,'''        req.user\n          .familyProfile\n          ?.investorEnabled ===\n          true''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check routes/ventures.js
          grep -q 'return user.familyProfile?.investorEnabled === true;' routes/ventures.js
          grep -A4 -B2 'const investorAllowed' routes/ventures.js | grep -q 'hasInvestorAccess'
      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add routes/ventures.js
          git commit -m "Allow Family Investor Mode across AIFT account roles"
          git push origin main
