name: Install AIFT Trust Layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-aift-trust-layer.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install trust layer
        run: node scripts/install-aift-trust-layer.js
      - name: Validate backend JavaScript
        run: |
          node --check server.js
          node --check routes/messages.js
          node --check routes/reviewCases.js
          node --check routes/studentIdentity.js
          node --check routes/familyStudentLinks.js
          node --check utils/contactSafety.js
          node --check models/ReviewCase.js
          node --check models/ChatSafetyViolation.js
      - name: Commit production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js routes/messages.js
          if git diff --cached --quiet; then
            echo "No integration changes required"
          else
            git commit -m "Mount AIFT Review Center and enforce chat safety [skip ci]"
            git push
          fi
