name: Enable Family workspace access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-access-any-aift.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Family access guards
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("routes/family.js"); s=p.read_text(); old="function isFamilyUser(user){\n  return Boolean(\n    user &&\n    (user.role === \"family\" || user.role === \"admin\")\n  );\n}"; new="function isFamilyUser(user){\n  return Boolean(user && (user._id || user.id));\n}"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("routes/familyChildren.js"); s=p.read_text(); old="function isFamilyUser(user) {\n\n  return (\n    user &&\n    (\n      user.role === \"family\" ||\n      user.role === \"admin\"\n    )\n  );\n\n}"; new="function isFamilyUser(user) {\n\n  return Boolean(\n    user &&\n    (user._id || user.id)\n  );\n\n}"; assert old in s; p.write_text(s.replace(old,new,1))'
          sed -i 's/Family account access required/Sign in to access Family Advantage/g' routes/family.js routes/familyChildren.js

      - name: Validate
        run: |
          node --check routes/family.js
          node --check routes/familyChildren.js
          ! grep -q 'Family account access required' routes/family.js
          ! grep -q 'Family account access required' routes/familyChildren.js

      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add routes/family.js routes/familyChildren.js
          git commit -m "Allow authenticated AIFT accounts to use Family workspace"
          git push origin main
