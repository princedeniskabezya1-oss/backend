name: Finalize Investment Introduction Flow
"on":
  push:
    branches: [main]
    paths: [".github/workflows/finalize-investment-introduction-flow.yml","scripts/finalize-investment-introduction-flow.js"]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/finalize-investment-introduction-flow.js
      - run: node --check routes/ventures.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ventures.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Finalize controlled AIFT investment introduction flow [skip ci]" && git push; fi
