name: Family production backend

on:
  push:
    branches: [main]
    paths:
      - "models/FamilyChild.js"
      - "models/FamilySavedDiscovery.js"
      - "models/ScholarshipApplication.js"
      - "routes/family.js"
      - "routes/familyChildren.js"
      - "routes/scholarshipApplications.js"
      - "routes/notifications.js"
      - "routes/conversations.js"
      - "routes/ventures.js"
      - ".github/workflows/family-production.yml"
  pull_request:
    paths:
      - "models/FamilyChild.js"
      - "models/FamilySavedDiscovery.js"
      - "models/ScholarshipApplication.js"
      - "routes/family.js"
      - "routes/familyChildren.js"
      - "routes/scholarshipApplications.js"
      - "routes/notifications.js"
      - "routes/conversations.js"
      - "routes/ventures.js"
      - ".github/workflows/family-production.yml"

permissions:
  contents: read

jobs:
  validate-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Family JavaScript syntax
        run: |
          node --check models/FamilyChild.js
          node --check models/FamilySavedDiscovery.js
          node --check models/ScholarshipApplication.js
          node --check routes/family.js
          node --check routes/familyChildren.js
          node --check routes/scholarshipApplications.js
          node --check routes/notifications.js
          node --check routes/conversations.js
          node --check routes/ventures.js
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Load production Family modules
        run: |
          node -e "require('./models/FamilyChild'); require('./models/FamilySavedDiscovery'); require('./models/ScholarshipApplication'); require('./routes/family'); require('./routes/familyChildren'); require('./routes/scholarshipApplications'); require('./routes/notifications'); require('./routes/conversations'); require('./routes/ventures'); console.log('Family modules loaded')"
