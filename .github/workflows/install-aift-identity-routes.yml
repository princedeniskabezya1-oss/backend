name: Install AIFT Identity Routes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-aift-identity-routes.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Patch server routes
        run: node scripts/install-aift-identity-routes.js
      - name: Validate changed backend files
        run: |
          node --check server.js
          node --check routes/studentIdentity.js
          node --check routes/familyStudentLinks.js
          node --check models/StudentIdentity.js
          node --check models/FamilyStudentLinkRequest.js
          node --check models/Notification.js
      - name: Commit server route mounts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No server changes required"
          else
            git commit -m "Mount AIFT student identity and family link routes [skip ci]"
            git push
          fi
